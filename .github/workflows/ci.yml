# Continuous integration: build every package, type-check, and make sure the
# committed generated outputs (packages/tokens/dist, packages/brand/dist) are
# up to date with their sources.

name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build · typecheck · verify generated outputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # version comes from the "packageManager" field in package.json — passing
        # both there and here is an error as of action-setup v4's stricter check.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm build:tokens

      - name: Build brand assets
        run: pnpm build:brand

      - name: Typecheck
        run: pnpm typecheck

      - name: Build site
        run: pnpm build:site
        env:
          BASE_PATH: /

      - name: Verify generated outputs are committed
        run: |
          # packages/tokens/dist is pure text (Style Dictionary output) and fully
          # deterministic across machines — a byte diff here always means the
          # committed dist is stale relative to packages/tokens/src. Block on it.
          if ! git diff --exit-code --stat -- packages/tokens/dist; then
            echo "::error::packages/tokens/dist is out of date."
            echo ""
            echo "Rebuild locally and commit the results:"
            echo "    pnpm build:tokens"
            echo "    git add packages/tokens/dist"
            echo ""
            exit 1
          fi

          # packages/brand/dist mixes deterministic text (manifest.json, SVGs)
          # with PNGs rasterised by sharp/libvips and zips built around them.
          # PNG content — and therefore its recorded size in manifest.json and
          # the compressed bytes of any zip that embeds it — can legitimately
          # differ by a few bytes for the *same* input across CPU architectures
          # (Apple Silicon dev machine vs. this x86_64 runner) or zlib builds.
          # That's a real, structural limitation of committing rasterised binary
          # assets, not a stale-dist bug, so content drift here is a warning,
          # never a failure. What we DO still want to catch: a rebuild that's
          # missing files entirely (a source/logic change nobody re-ran for).
          brand_diff="$(git diff --name-only -- packages/brand/dist)"
          if [ -n "$brand_diff" ]; then
            echo "::warning::packages/brand/dist content differs by a few bytes from this runner's fresh build (expected — see build-assets.mjs's header comment on cross-platform PNG/zip reproducibility, not a stale-dist bug):"
            echo "$brand_diff"
          fi
          brand_missing="$(git diff --name-only --diff-filter=D -- packages/brand/dist)"
          if [ -n "$brand_missing" ]; then
            echo "::error::A fresh build:brand no longer produces these committed files — rebuild and investigate:"
            echo "$brand_missing"
            exit 1
          fi

          untracked="$(git ls-files --others --exclude-standard -- packages/tokens/dist packages/brand/dist)"
          if [ -n "$untracked" ]; then
            echo "::error::New generated files are not committed:"
            echo "$untracked"
            echo ""
            echo "Run: git add packages/tokens/dist packages/brand/dist"
            exit 1
          fi
          echo "Generated outputs are up to date."
