# Continuous integration: build every package, type-check, and make sure the
# committed generated outputs (packages/tokens/dist, packages/brand/dist) are
# up to date with their sources.

name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build · typecheck · verify generated outputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # version comes from the "packageManager" field in package.json — passing
        # both there and here is an error as of action-setup v4's stricter check.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm build:tokens

      - name: Build brand assets
        run: pnpm build:brand

      - name: Typecheck
        run: pnpm typecheck

      - name: Build site
        run: pnpm build:site
        env:
          BASE_PATH: /

      - name: Verify generated outputs are committed
        run: |
          # packages/tokens/dist is pure text (Style Dictionary output) and fully
          # deterministic across machines — a byte diff here always means the
          # committed dist is stale relative to packages/tokens/src. Block on it.
          if ! git diff --exit-code --stat -- packages/tokens/dist; then
            echo "::error::packages/tokens/dist is out of date."
            echo ""
            echo "Rebuild locally and commit the results:"
            echo "    pnpm build:tokens"
            echo "    git add packages/tokens/dist"
            echo ""
            exit 1
          fi

          # packages/brand/dist mixes deterministic text (manifest.json, SVGs) with
          # PNGs rasterised by sharp/libvips, whose native codec can emit a few
          # different bytes for the same input across CPU architectures (Apple
          # Silicon dev machine vs. this x86_64 runner) — a real, structural
          # limitation, not a stale-dist bug. So: fail on anything that isn't a
          # PNG (missed rebuild, changed SVG source, new/removed files), warn only
          # on PNG content drift.
          brand_diff="$(git diff --name-only -- packages/brand/dist)"
          brand_non_png="$(echo "$brand_diff" | grep -v '\.png$' || true)"
          if [ -n "$brand_non_png" ]; then
            echo "::error::packages/brand/dist has non-PNG changes that must be rebuilt and committed:"
            echo "$brand_non_png"
            echo ""
            echo "Rebuild locally and commit the results:"
            echo "    pnpm build:brand"
            echo "    git add packages/brand/dist"
            exit 1
          fi
          if [ -n "$brand_diff" ]; then
            echo "::warning::PNG(s) in packages/brand/dist differ by a few bytes from this runner's sharp/libvips build (expected across CPU architectures, not a stale-dist bug):"
            echo "$brand_diff"
          fi

          untracked="$(git ls-files --others --exclude-standard -- packages/tokens/dist packages/brand/dist)"
          if [ -n "$untracked" ]; then
            echo "::error::New generated files are not committed:"
            echo "$untracked"
            echo ""
            echo "Run: git add packages/tokens/dist packages/brand/dist"
            exit 1
          fi
          echo "Generated outputs are up to date."
